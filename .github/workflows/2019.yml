name: 2019 · Java

on:
  push:
    branches: [main]
    paths: ['2019/**', '.github/workflows/2019.yml']
  pull_request:
    paths: ['2019/**', '.github/workflows/2019.yml']
  workflow_dispatch:

jobs:
  example-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 2019
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B test -Dtest='*Test*#testExample*' -Dsurefire.failIfNoSpecifiedTests=false
