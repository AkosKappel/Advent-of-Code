name: 2023 · JavaScript

on:
  push:
    branches: [main]
    paths: ['2023/**', '.github/workflows/2023.yml']
  pull_request:
    paths: ['2023/**', '.github/workflows/2023.yml']
  workflow_dispatch:

jobs:
  example-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 2023
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: 2023/package-lock.json
      - run: npm ci
      - run: npx jest -t example
