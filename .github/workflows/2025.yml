name: 2025 · Elixir

on:
  push:
    branches: [main]
    paths: ['2025/**', '.github/workflows/2025.yml']
  pull_request:
    paths: ['2025/**', '.github/workflows/2025.yml']
  workflow_dispatch:

jobs:
  example-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 2025
    steps:
      - uses: actions/checkout@v7
      - uses: erlef/setup-beam@v1
        with:
          version-file: 2025/.tool-versions
          version-type: strict
      - run: mix deps.get
      - run: mix test --only test:'test part1 example' --only test:'test part2 example'
