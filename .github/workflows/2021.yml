name: 2021 · Python

on:
  push:
    branches: [main]
    paths: ['2021/**', '.github/workflows/2021.yml']
  pull_request:
    paths: ['2021/**', '.github/workflows/2021.yml']
  workflow_dispatch:

jobs:
  example-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: 2021
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: 2021/requirements.txt
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -k example
        working-directory: 2021/tests
        env:
          PYTHONPATH: ..
